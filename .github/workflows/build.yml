name: Build C++ ESTMEDI to EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MinGW environment
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: false
        install: git mingw-w64-x86_64-toolchain

    - name: Compile with G++
      shell: msys2 {0}
      run: |
        g++ -std=c++17 main.cpp -o ESTMEDI.exe -lstdc++fs -lgdi32 -luser32 -static -mwindows

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: ESTMEDI-Classic-EXE
        path: ESTMEDI.exe
