name: Build C++ ESTMEDI to EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MinGW
      uses: egor-tukin/setup-mingw@v2
      with:
        version: 13.1.0
        platform: x64

    - name: Compile C++ Win32 GUI Code
      run: |
        g++ -std=c++17 main.cpp -o ESTMEDI.exe -lstdc++fs -lgdi32 -luser32 -static -mwindows

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: ESTMEDI-Classic-EXE
        path: ESTMEDI.exe
