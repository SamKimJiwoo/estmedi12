name: Build C++ ESTMEDI to EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install MinGW via Chocolatey
      run: |
        choco install mingw -y

    - name: Add MinGW to PATH and Verify
      run: |
        echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $env:GITHUB_PATH
        g++ --version

    - name: Compile C++ Win32 Code
      run: |
        g++ -std=c++17 main.cpp -o ESTMEDI.exe -lstdc++fs -static -mwindows

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: ESTMEDI-Classic-EXE
        path: ESTMEDI.exe
