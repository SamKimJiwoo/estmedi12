name: Build C++ ESTMEDI to EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: false
        install: mingw-w64-ucrt-x86_64-gcc

    - name: Check files and Compile C++
      shell: msys2 {0}
      run: |
        echo "=== 현재 폴더 파일 목록 확인 ==="
        ls -la
        
        echo "=== C++ 컴파일 시작 ==="
        g++ -std=c++17 main.cpp -o ESTMEDI.exe -lstdc++fs -lgdi32 -luser32 -static -mwindows
        
        echo "=== 빌드된 파일 확인 ==="
        ls -la ESTMEDI.exe

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: ESTMEDI-Classic-EXE
        path: ESTMEDI.exe
