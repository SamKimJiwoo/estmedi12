name: Build C++ ESTMEDI to EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compile C++ Win32 GUI Code with MSVC
      shell: cmd
      run: |
        cl /EHsc main.cpp /Fe:ESTMEDI.exe user32.lib gdi32.lib gdiplus.lib ole32.lib uuid.lib

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: ESTMEDI-Classic-EXE
        path: ESTMEDI.exe
