name: Build ESTMEDI

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compile C++ with MSVC
      shell: cmd
      run: cl /EHsc /DUNICODE /D_UNICODE main.cpp /Fe:ESTMEDI.exe user32.lib gdi32.lib

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ESTMEDI-EXE
        path: ESTMEDI.exe
